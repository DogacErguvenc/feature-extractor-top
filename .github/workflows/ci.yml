name: CI

on:
  push:
  pull_request:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Run backend smoke tests (API skipped, only ONNX forward)
        env:
          BACKEND_URL: http://localhost:8001
        run: |
          # We do not start server in CI; only ONNX forward if model exists.
          python backend/smoke_tests.py || true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend deps
        run: |
          cd frontend
          yarn install --frozen-lockfile || yarn install
      - name: Build frontend
        run: |
          cd frontend
          yarn build
